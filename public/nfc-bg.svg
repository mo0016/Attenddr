<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="fade" x1="0.5" y1="0" x2="0" y2="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- large wave set, top-right -->
  <g stroke="#12996B" stroke-width="1.2" opacity="0.18">
    <circle cx="1100" cy="180" r="140"/>
    <circle cx="1100" cy="180" r="220"/>
    <circle cx="1100" cy="180" r="310"/>
    <circle cx="1100" cy="180" r="410"/>
  </g>
  <g stroke="#12996B" stroke-width="1.5" opacity="0.28">
    <circle cx="1100" cy="180" r="180"/>
    <circle cx="1100" cy="180" r="270"/>
    <circle cx="1100" cy="180" r="370"/>
  </g>
  <g stroke="#12996B" stroke-width="1" opacity="0.12">
    <circle cx="1100" cy="180" r="160"/>
    <circle cx="1100" cy="180" r="250"/>
    <circle cx="1100" cy="180" r="350"/>
    <circle cx="1100" cy="180" r="460"/>
  </g>

  <!-- medium wave set, right-center -->
  <g stroke="#0E7C57" stroke-width="1" opacity="0.15">
    <circle cx="980" cy="520" r="120"/>
    <circle cx="980" cy="520" r="200"/>
    <circle cx="980" cy="520" r="290"/>
    <circle cx="980" cy="520" r="380"/>
  </g>
  <g stroke="#0E7C57" stroke-width="1.3" opacity="0.22">
    <circle cx="980" cy="520" r="160"/>
    <circle cx="980" cy="520" r="250"/>
  </g>

  <!-- small wave set, mid-right -->
  <g stroke="#12996B" stroke-width="1.5" opacity="0.25">
    <circle cx="1060" cy="440" r="50"/>
    <circle cx="1060" cy="440" r="85"/>
    <circle cx="1060" cy="440" r="125"/>
  </g>
  <g stroke="#12996B" stroke-width="1" opacity="0.13">
    <circle cx="1060" cy="440" r="70"/>
    <circle cx="1060" cy="440" r="105"/>
    <circle cx="1060" cy="440" r="150"/>
  </g>

  <!-- bottom-right faint waves -->
  <g stroke="#12996B" stroke-width="1" opacity="0.1">
    <circle cx="1040" cy="760" r="100"/>
    <circle cx="1040" cy="760" r="170"/>
    <circle cx="1040" cy="760" r="250"/>
  </g>

  <!-- solid central node dots -->
  <circle cx="1100" cy="180" r="4" fill="#12996B" opacity="0.35"/>
  <circle cx="1060" cy="440" r="3.5" fill="#12996B" opacity="0.45"/>
  <circle cx="980" cy="520" r="3" fill="#0E7C57" opacity="0.3"/>
  <circle cx="1040" cy="760" r="2.5" fill="#12996B" opacity="0.2"/>

  <!-- overlay gradient fade from right to left -->
  <rect width="1200" height="800" fill="url(#fade)"/>
</svg>